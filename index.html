.suggest button:hover small, .suggest button[aria-selected="true"] small { color: var(--bg); }

/* ---------- One church ---------- */
.card { border-bottom: 1px solid var(--rule); min-width: 0; scroll-margin: calc(var(--stick, 0px) + 12px) 0 12px; }

":"Brethren & Free Church","includes":"Church of the Brethren, Brethren in Christ, Moravian, Evangelical Free, Evangelical Covenant","expect":"Simple, Bible-centered worship with a strong sense of community. This family grew out of European renewal movements that prized a lived, personal faith.","ws":[1.5,3],"p":"leans","w":"varies","e":["teaching","discipleship","mission"]},{"id":"catholic","label":"Catholic","includes":"Roman Catholic and Eastern Catholic churches","expect":"The Mass follows a set liturgy and the Eucharist is celebrated at every service. Expect Scripture readings, a short homily, kneeling and standing, and prayers said together.","ws":[0,0.8],"p":"traditional","w":"no","e":["sacrament","roots","justice"]},{"id":"restorationist","label":"Christian / Restorationist","includes":"Churches of Christ, Disciples of Christ, independent Christian Churches","expect":"These churches aim to follow the pattern of the New Testament church. Communion is shared every Sunday, and many Churches of Christ sing without instruments.","ws":[1,2.8],"p":"leans","w":"varies","e":["teaching","sacrament","mission"]},{"id":"congregational","label":"Congregational","includes":"United Church of Christ, Congregational Christian churches","expect":"Each congregation governs itself. Services are usually traditional in form, with hymns, prayers and a sermon, and many congregations put a strong emphasis on service and welcome.","ws":[0.8,1.8],"p":"mixed","w":"yes","e":["justice","questions","roots"]},{"id":"anglican","label":"Episcopal / Anglican","includes":"Episcopal Church, Anglican Church in North America, continuing Anglican churches","expect":"Worship follows the Book of Common Prayer: Scripture readings, prayers said together, a sermon, and communion most Sundays. Some parishes are formal, with choir and incense; others are relaxed.","ws":[0,1.2],"p":"mixed","w":"varies","e":["sacrament","roots","questions"]},{"id":"friends","label":"Friends (Quaker)","includes":"Friends mee /* ------------------------------------------------------------------ search and filter */
async function runSearch(fitMap = true) {
  const token = ++S.token;
  S.loading = true; S.error = '';
  show('app'); renderResults();
  try {
    await loadIndex();
    let found = [], radius = S.radius;
    if (S.auto) {
      for (const r of RADII) { radius = r; found = await within(S.origin, r); if (found.length >= 20) break; }
    } else found = await within(S.origin, radius);
    if (token !== S.token) return;
    S.radius = radius; S.all = found; S.loading = false; S.page = 1; S.spot = null; S.sel = null;
    nameOrigin();
    save(); applyFilters(); renderResults(); updateMap(fitMap);
  } catch (e) {
    if (token !== S.token) return;
    S.loading = false; S.error = 'We could not load the church list just now. Check your connection and try again.';
    renderResults();
  }
}
/* "Your location" becomes "Franklin, TN" when the nearest churches agree on a city. */
function nameOrigin() {
  const votes = new Map();
  for (const it of S.all.slice(0, 15)) {
    if (!it.c.city || it.dist > 6) continue;
    const k = it.c.city + ', ' + it.c.st;
    votes.set(k, (votes.get(k) || 0) + 1);
  }
  const top = [...votes.entries()].sort((a, b) => b[1] - a[1])[0];

}
function tradFilter(it) {
  return S.trad.startsWith('d:') ? it.c.d === +S.trad.slice(2) : profileOf(it.c.d).tid === S.trad;
}
function applyFilters() {
  const avoid = new Set(S.answers.avoid);
  let hidden = 0;
  const base = [];
  for (const it of S.all) {
    if (avoid.size && !S.showAvoided && avoid.has(profileOf(it.c.d).tid)) { hidden++; continue; }
    it.fit = S.hasProfile ? fitOf(it.c.d).score : null;
    base.push(it);
  }
  S.hiddenAvoid = hidden; S.base = base;
  let out = base;
  if (S.spot) out = out.filter((it) => S.spot.ids.has(it.c.uid));
  if (S.onlyExact) out = out.filter((it) => it.c.locq !== 2);
  if (S.q) {
    const q = S.q.toLowerCase().trim();
    out = out.filter((it) => (it.c.key || (it.c.key = (it.c.name + ' ' + it.c.city).toLowerCase())).includes(q));

  S.pool = out;                                        // everything but the tradition filter: the chips count from this
  if (S.trad) out = out.filter(tradFilter);

const WHERE_DEFAULT = "Your location is used on this device to measure distance. It isn't saved, and it isn't sent to us.";

  }, (err) => {

  if (raw.length < 2 || /^\d/.test(raw)) { close(); return; }
  const [cityPart, statePart] = raw.split(',').map((x) => x.trim());
  const q = normPlace(cityPart), st = (statePart || '').toUpperCase().slice(0, 2);

  if (act === 'clear-filters') { S.trad = null; S.q = ''; $('#q').value = ''; S.onlyExact = false; S.spot = null; S.page = 1; applyFilters(); renderResults(); updateMap(false); }
  if (act === 'edit-answers') openQuiz(0);
  if (act === 'clear-answers') { S.answers = blankAnswers(); S.hasProfile = false; fitCache = new Map(); S.tab = 'finder'; S.sort = 'near'; S.trad = null; S.showAvoided = false; save(); show('app'); applyFilters(); renderResults(); updateMap(false); }
});
$('#where-form').addEventListener('submit', (e) => { e.preventDefault(); submitWhere(); });
let typing = 0;
$('#where').addEventListener('input', (e) => { clearTimeout(typing); const v = e.target.value; typing = setTimeout(() => suggest(v), 110); });
$('#where').addEventListener('keydown', (e) => {
  if (!suggestions.length) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    active = (active + (e.key === 'ArrowDown' ? 1 : -1) + suggestions.length) % suggestions.length;
    $$('#suggest button').forEach((b, i) => b.setAttribute('aria-selected', String(i === active)));
  } else if (e.key === 'Escape') { $('#suggest').hidden = true; suggestions = []; }
});
$('#where').addEventListener('blur', () => setTimeout(() => { $('#suggest').hidden = true; }, 180));
let searching = 0;
$('#q').addEventListener('input', (e) => { clearTimeout(searching); const v = e.target.value; searching = setTimeout(() => { S.q = v; S.page = 1; S.sel = null; applyFilters(); renderChips(); renderCount(); renderList(); updateMap(false); }, 160); });
$('#only-exact').addEventListener('change', (e) => { S.onlyExact = e.target.checked; S.page = 1; applyFilters(); renderResults(); updateMap(false); });
$('#map').addEventListener('click', (e) => { const dot = e.target.closest && e.target.closest('circle[data-id]'); if (dot) select(dot.dataset.id, 'map'); });

/* The block keeps its text off the screen edge wherever it touches one. */
function edges() {
  const r = host.getBoundingClientRect();
  host.toggleAttribute('data-edge-left', r.left < 8);
  host.toggleAttribute('data-edge-right', document.documentElement.clientWidth - r.right < 8);
}
/* If the site keeps a header on screen, the map that follows you down the page stops below it. */
function stick() {
  let h = 0;
  const top = document.elementFromPoint(document.documentElement.clientWidth / 2, 2);
  for (let n = top; n && n !== document.body && n !== document.documentElement; n = n.parentElement) {
    const pos = getComputedStyle(n).position;
    if (pos === 'fixed' || pos === 'sticky') h = Math.max(h, n.getBoundingClientRect().bottom);
  }
  host.style.setProperty('--stick', Math.max(0, Math.min(h, 220)) + 'px');
}
edges(); stick();
window.addEventListener('resize', () => { edges(); stick(); });
let ticking = 0;
window.addEventListener('scroll', () => { if (!ticking) ticking = setTimeout(() => { ticking = 0; stick(); }, 250); }, { passive: true });

/* The wheat mark, drawn wherever the markup asks for it. */
const wheat = $('#wheat-path').getAttribute('d');
$$('svg[data-wheat]').forEach((svg) => {
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  p.setAttribute('d', wheat); p.setAttribute('fill', 'currentColor'); p.setAttribute('fill-rule', 'evenodd');
  svg.appendChild(p);
});

/* ------------------------------------------------------------------ start */
restore();
const link = new URLSearchParams(window.location.search);
if (DEBUG) host.ggc = { S, map: () => map, fitOf, profileOf, index: () => INDEX, reset: () => { fitCache = new Map(); } };
show('start');
loadIndex().then(async () => {
  const near = (link.get('near') || '').split(',').map(Number);
  if (link.get('tab') === 'matcher' && !S.hasProfile) { if (near.length !== 2 && !link.get('zip')) { openQuiz(0); return; } }
  if (near.length === 2 && near.every(Number.isFinite)) { setOrigin({ lat: near[0], lng: near[1], kind: 'link', label: 'this spot' }); return; }
  if (/^\d{5}$/.test(link.get('zip') || '')) { $('#where').value = link.get('zip'); submitWhere(); return; }
  if (S.origin) runSearch();
}).catch(() => { whereMsg('We could not load the church list just now. Check your connection and reload the page.', true); });
})();
</script>
